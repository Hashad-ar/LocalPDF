[package]
name = "localpdf-word-helper"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "LocalPDF-WordHelper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_Variant",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
